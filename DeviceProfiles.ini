[Android_VeryHigh Devicefile]
; Kept maxed - these are what make characters/environments look sharp,
; and none of them were implicated in your reported bugs
CVars=r.DefaultFeature.AntiAliasing=2
CVars=sg.AntiAliasingQuality=4
CVars=sg.TextureQuality=4
CVars=sg.PostProcessQuality=2
CVars=r.Kuro.KuroEnableFFTBloom=1
CVars=r.Kuro.KuroBloomStreak=3
CVars=r.KuroVolumeCloudEnable=1
CVars=r.imp.SSMbScaleLod0=0.0
CVars=r.imp.SSMbScaleLod1=0.0
CVars=r.Kuro.SMAALevelOverride=2
CVars=r.Kuro.InteractionEffect.EnableFoliageEffect=1
CVars=r.Kuro.InteractionEffect.UseCppWaterEffect=1

; Reduced for stable 30 FPS / lower sustained heat on Tensor G1 + Mali
CVars=sg.ViewDistanceQuality=3
CVars=sg.ShadowQuality=3
CVars=sg.FoliageQuality=2
CVars=sg.EffectsQuality=2
CVars=wp.Runtime.LoadingRangeScale=1.2
CVars=wp.Runtime.PlannedLoadingRangeScale=1.2
CVars=r.Kuro.Foliage.EnableFoliageCulling=1
CVars=r.Kuro.Foliage.GrassCullDistanceMax=13000
CVars=r.Kuro.Foliage.Grass3_0CullDistanceMax=13000
CVars=r.Kuro.NpcDisappearDistance=13000

; Set ONCE, here only - this is what was contradicting itself between your
; two donor files. Enabled = the game is allowed to back off before it
; overheats, instead of running unrestrained until Android throttles it.
CVars=r.Kuro.AutoCoolEnable=1

CVars=r.Android.DisableVulkanSupport=0

[Android_Default DeviceProfile]
BaseProfileName=Android_VeryHigh
DeviceScore=9999

; Your exact GPU (Pixel 6 Pro = Mali-G78). Frame Generation (r.KuroFI.Enable)
; was tested and confirmed to cause both the hair-rendering glitch and the
; bike issue - motion interpolation struggling with thin/fast geometry like
; hair strands and wheel spokes. Left out deliberately. Vulkan tested clean,
; so that stays enabled via r.Android.DisableVulkanSupport=0 above.
[Android_Mali_G78 DeviceProfile]
BaseProfileName=Android_VeryHigh
DeviceScore=9999
