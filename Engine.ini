; ---------------------------------------------------------------------------
; Everything below is new. Nothing here duplicates a setting that also lives
; in DeviceProfiles.ini (shadow quality, view distance, foliage, grass/NPC
; cull distances, AutoCoolEnable all live ONLY in the device profile below
; to avoid the two files fighting over the same cvar).
; ---------------------------------------------------------------------------

[/Script/Engine.GarbageCollectionSettings]
gc.AllowIncrementalReachability=1
gc.AllowIncrementalGather=1
gc.IncrementalReachabilityTimeLimit=0.003
gc.IncrementalGCTimePerFrame=0.003
gc.AllowParallelGC=1
gc.MultithreadedDestructionEnabled=1

[/Script/Engine.RendererSettings]
; Visual style you said you liked - kept as-is
r.BloomQuality=5
r.KuroMobile.LensFlareQuality=3
r.Kuro.KuroBloomStreak=3
r.Tonemapper.Quality=4
r.Tonemapper.Sharpen=2.5
r.Color.Min=-0.002
r.Color.High=1.25
r.Color.Max=1.5
r.LightShaftColorScale=1.10
r.FidelityFX.FSR.SecondaryUpscale=1
r.FidelityFX.FSR.RCAS.Sharpness=1.0
r.SceneColorFringeQuality=0

; Shadow detail (cascade distances/resolution/PCF quality) - his file tuned
; these individually rather than relying on the blunt sg.ShadowQuality tier
r.Mobile.GTAO.Quality=3
r.DistanceFieldA0=1
r.RefractionQuality=2
r.Shadow.RadiusThreshold=0.02
r.Shadow.MinResolution=512
r.Shadow.PerObjectShadowMapResolution=512
r.Shadow.PerObjectResolutionMax=512
r.Shadow.PerObjectResolutionMin=512
r.Shadow.CSM0ShadowPCFQuality=3
r.Shadow.CSM1ShadowPCFQuality=3
r.Shadow.CSM2ShadowPCFQuality=3
r.Shadow.CSM3ShadowPCFQuality=3
r.Shadow.PerObjShadowPCFQuality=3
r.Shadow.CSM0Distance=800
r.Shadow.CSM1Distance=2000
r.Shadow.CSM2Distance=6500
r.Shadow.CSM3Distance=15000
r.Shadow.CSM4Distance=40000
r.Shadow.CSM.MaxCascades=5
r.Shadow.SkeletalMeshLODBias=0
r.Shadow.AllShadowDrawcallMax=1500
r.MeshDrawCommands.ShadowPerBatchDrawcallMax=2000

; Subsurface scattering, fog, HDR, material quality
r.SSS.Quality=2
r.SSS.HalfRes=0
r.Mobile.DisableVertexFog=0
r.Mobile.HighQualitySkyCaptureFiltering=1
r.MobileHDR=1
r.Mobile.HighQualityMaterial=1
r.Mobile.SupportsGen4TAA=1

; Water and reflections
r.Mobile.WaterSSRStep=196
r.SSR.MaxRoughness=0.9
r.SSR.Quality=2
r.SSR.Temporal=1
r.SSR.HalfResSceneColor=0
r.SSR.Stencil=1
r.Upscale.Quality=2
;r.SSGI.Enable=1 ; commented out - heaviest line in this block, cut preemptively given thermal priority over max visual fidelity. Uncomment to test if thermals hold up fine without it.
r.SSFS.HighQuality=1
r.SSFS.FullPrecision=1
r.SSFS=1
r.Water.Reflections=1
r.Water.SpecularGlossiness=1.8
r.Water.SingleLayer.Enable=1
r.Water.Surface.Ripple.Speed=1.5
r.Water.Surface.Foam.Density=1
r.Water.Foam.Density=1
r.Water.Caustics.Enable=1
r.Water.Surface.NormalStrength=2.0
r.Mobile.WaterSSRResDiv=1.0
r.Mobile.EnableLandscapeSSR=1
r.Mobile.SSRLowPrecisionDepth=0

; Lumen reflections and light shafts
r.Lumen.ScreenProbeGather.Temporal.DistanceThreshold=0.03
r.Lumen.Reflections.AsyncCompute=1
r.Lumen.Reflections.ScreenTraces=0
r.Lumen.Reflections.SmoothBias=1.0
r.MobileLightShaft=1
r.LightShaftAllowTAA=1
r.MobileLightShaft.AllowTAA=1
r.MobileLightShaft.DownSampleFactor=1
r.LightShaftBloom=1
r.LightShaftQuality=2
r.LightShaftDownSampleFactor=1.3
r.LightShaftBlurPasses=3
r.LightShaftNumSamples=5
r.LightShaftFirstPassDistance=0.05
r.LightShaftRenderToSeparateTranslucency=1
r.LightShaftBloomScale=0.85
r.LightShaftDepthScale=1.10
r.LightShaftOcclusionScale=2.0

; TAA blend weights - sharper/more responsive image (from donor)
r.TemporalAA.MobileStaticFrameWeight=0.25
r.TemporalAA.MobileFrameWeight=0.30

; Foliage detail, culling/occlusion, misc
foliage.LODDistanceScale=3
foliage.DensityType=2
fx.Niagara.ForceAutoPooling=1
r.Niagara.EmitterViewDistanceScale=1.5
r.GPUScene.ValidatePrimitiveBuffer=0
r.EarlyZPassOnlyMaterialMasking=1
r.AllowUseAnyLODAsOcclusionData=1
r.ScreenSizeCullRatioFactor=1
r.AllowPrecomputedVisibility=1
r.AlsoUseSphereForFrustumCull=1
r.InstanceCulling.OcclusionCull=1
r.Streaming.Anisotropy=8

; NOT ported, on purpose:
;   wp.Runtime.SoraGridBlackListHeight / MobileNear-Middle-GrassCullDistanceMax
;   / KuroRuntimeStreamingRangeOverallScale - these are view-distance/streaming
;   settings, same category as the grass/NPC distances already reduced for
;   thermal reasons. Bringing them in at his full values would undercut that
;   trade-off, so skipped rather than silently guessed at a middle value.
;   Bulk gc.* tuning block - not visual, left as the smaller curated set above.
r.MaxAnisotropy=16

; Generic mobile perf/parallelism cvars - not implicated in your reported bugs
r.PSOPrecaching=1
r.GPUScene=1
r.AsyncCompute=1
r.MeshDrawCommands.ParallelPassSetup=1
r.ParallelMeshDrawCommandPass=1
r.ParallelInitViews=1
r.ParallelFrustumCull=1
r.Streaming.AsyncLoadingThreadCount=8

; Deliberately OMITTED vs. the donor config, and why:
;   r.SkylightIntensityMultiplier=0.5   -> prime suspect for scenes being
;                                          too dark to see, not just moody
;   r.EyeAdaptation.Min/Max             -> was clamping exposure, compounding
;                                          the above
;   (color grading r.Color.Min/High/Max and r.LightShaftColorScale WERE kept -
;    those give contrast/rich blacks without darkening the whole scene)
;   r.Kuro.AutoCoolEnable=0             -> conflicted with DeviceProfiles.ini's =1;
;                                          that contradiction is a likely source of
;                                          the thermal throttling + hitching
;   r.ShadowQuality / grass & NPC cull  -> now defined once, in the device profile,
;   distances / view distance             instead of duplicated here
